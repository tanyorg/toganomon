# One entry point for the console: the page, toganomon's JSON and METAR/TAF,
# and ultrafeeder's tar1090 under /tar1090/ (same origin, so no CORS).
server {
    listen 80;
    server_tokens off;                   # no nginx version in headers and error pages
    root /usr/share/nginx/html;          # console/
    index index.html;

    # The page itself is checked every time (a 304 when unchanged), so a
    # browser sees new ?v= on the parts (tools/stamp_console.py) at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /web/ {                     # web/: the go-around view parts
        alias /srv/web/;
    }

    location /toganomon/ {               # the worker's output (volume)
        alias /srv/toganomon/;
        add_header Cache-Control "no-store";
    }

    location = /tar1090 { return 301 /tar1090/; }
    location /tar1090/ {
        proxy_pass http://ultrafeeder:80/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
