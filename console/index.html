<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>toganomon console</title>
    <link rel="stylesheet" href="/web/goaround.css?v=e00f016c">
    <link rel="stylesheet" href="float.css?v=1bf70ad0">
    <link rel="stylesheet" href="stats.css?v=3e7ab781">
    <link rel="stylesheet" href="wind.css?v=d99efe32">
    <link rel="stylesheet" href="movements.css?v=b1e16b7d">
    <link rel="stylesheet" href="console.css?v=8bf1a050">
</head>
<body>
    <header>
        <div class="airport">
            <span class="icao" id="icao">----</span>
            <span class="brand">toganomon</span>
        </div>
        <div class="wx">
            <div class="wx-line"><span class="wx-label">METAR</span><span id="metarAge" class="wx-age"></span><span id="metar" class="wx-text">--</span></div>
            <div class="wx-line"><span class="wx-label">TAF</span><span id="tafAge" class="wx-age"></span><span id="taf" class="wx-text">--</span></div>
        </div>
        <div class="clocks">
            <div class="clock"><span class="clock-label">UTC</span><span id="clockUtc" class="clock-val">--:--:--</span></div>
            <div class="clock"><span class="clock-label" id="clockLocalLabel">LOCAL</span><span id="clockLocal" class="clock-val">--:--:--</span></div>
        </div>
        <nav class="buttons" aria-label="windows">
            <button class="win-btn" id="windBtn" title="RWY/WIND" aria-label="RWY/WIND">🛬</button>
            <button class="win-btn" id="statsBtn" title="LAST 24H" aria-label="LAST 24H">📊</button>
            <button class="win-btn" id="gaBtn" title="GO-AROUNDS" aria-label="GO-AROUNDS">🛫</button>
            <button class="win-btn" id="mvBtn" title="MOVEMENTS" aria-label="MOVEMENTS">📋</button>
        </nav>
    </header>
    <main>
        <iframe id="map" title="tar1090" src="about:blank"></iframe>
    </main>

    <section class="float wind-float" id="windFloat" aria-label="RWY/WIND" hidden>
        <div class="float-bar"><span>RWY/WIND</span><button class="float-close" aria-label="close">×</button></div>
        <div class="float-body" id="windBody"></div>
    </section>

    <section class="float stats-float" id="statsFloat" aria-label="LAST 24H" hidden>
        <div class="float-bar"><span>LAST 24H</span><button class="float-close" aria-label="close">×</button></div>
        <div class="float-body" id="statsBody"></div>
    </section>

    <section class="float float-fill ga-window" id="gaFloat" aria-label="GO-AROUNDS" hidden>
        <div class="float-bar"><span>GO-AROUNDS</span><button class="float-close" aria-label="close">×</button></div>
        <div class="float-body" id="gaList"></div>
    </section>

    <section class="float float-fill mv-window" id="mvFloat" aria-label="MOVEMENTS" hidden>
        <div class="float-bar"><span>MOVEMENTS</span><button class="float-close" aria-label="close">×</button></div>
        <div class="float-body" id="mvBody"></div>
    </section>

    <script src="/web/goaround.js?v=8d4eb150"></script>
    <script src="clock.js?v=4d61bac0"></script>
    <script src="wx.js?v=027c1cd6"></script>
    <script src="float.js?v=c1494064"></script>
    <script src="wind.js?v=591ceea1"></script>
    <script src="stats.js?v=24357fce"></script>
    <script src="movements.js?v=39260bc2"></script>
    <script src="console.js?v=b64f71b1"></script>
</body>
</html>
