# toganomon configuration for Fukuoka (RJFF).
# Copy to /etc/toganomon.toml and adjust the paths.

[airport]
icao = "RJFF"
# Everything else of the airport comes from airports.json (RJFF is in it):
# the reference point, the elevation and the runway gates. To set them by
# hand, or for an airport not in airports.json:
# arp = [33.585899, 130.451004]  # airport reference point (lat, lon)
# elevation_ft = 32              # the gate altitudes are heights above this

# One [[runway]] per runway (or group of close parallel runways sharing one
# gate). ends = the two designators; true_track = TRUE track flown on the
# first end (not the magnetic heading); the gate is a box around the
# extended centreline through center (default: the ARP). Check the values
# with: toganomon.py --check-runways
# [[runway]]
# ends = ["16", "34"]
# true_track = 150.3
# center = [33.586069, 130.4492]   # between 16L/34R and 16R/34L
# gate_along_km = 6.0              # each way from the centre along the centreline
# gate_cross_km = 1.1              # each side of the centreline
# length_m = 2800                  # only for drawing

# Heights above the airport elevation. Departures from 16 are first
# received anywhere from the ground to ~1400 ft, hence the higher
# departure limit.
[gate]
arr_alt_ft = 1000
dep_alt_ft = 2000
track_tol_deg = 20.0
rate_fpm = 200

[go_around]
window_s = 600                   # arrival -> departure within this
min_gs_kt = 60                   # slower arrivals are never paired
exclude_categories = ["A7"]      # rotorcraft

# Aircraft whose traces are read: within radius_km of the ARP and below
# max_alt_ft above the airport, and for 5 minutes after that. Keep
# max_alt_ft well above dep_alt_ft: a departure first heard in the climb can
# be some 3000 ft higher at the next run.
[candidates]
radius_km = 15.0
max_alt_ft = 6000

[paths]
aircraft = "/run/readsb/aircraft.json"
traces = "/run/readsb/traces"
state = "/var/lib/toganomon/state.json"
history = "/var/lib/toganomon/go_arounds.json"
summary = "/var/www/html/toganomon/summary.json"
go_arounds = "/var/www/html/toganomon/go-arounds.json"
# metar = "/var/www/html/metar.txt"   # raw METAR text for the QNH correction and wind
# log = "/var/log/toganomon-events.log" # one line per go-around
# movements_log = "/var/log/toganomon-movements.log" # one line per arrival/departure
# aircraft_db = "/usr/local/share/tar1090/git-db/db" # tar1090-db: registration and type
